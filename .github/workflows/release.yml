name: Package WoW Addon

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # Only the repository owner may publish packs; releases by anyone else build nothing.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mutagen

      - name: Generate VoiceoversList.lua for every locale
        run: python generate_voiceovers_list.py

      # One ZIP per addon folder (one folder per locale), e.g.
      # ChattyLittleNpc_Vanilla_enUS_voiceovers-v3.3.4.zip and ChattyLittleNpc_Vanilla_deDE_voiceovers-v3.3.4.zip
      - name: Create Addon ZIPs
        run: |
          mkdir dist
          for dir in */; do
            name="${dir%/}"
            [ -f "$name/$name.toc" ] || continue
            zip -r "dist/$name-${{ github.ref_name }}.zip" "$name" -x "$name/.vscode/*"
          done
          ls -lh dist
          [ -n "$(ls dist)" ] || { echo "No addon folders found"; exit 1; }

      - name: Upload ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
